<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #06090f;
    --surface:   #0d1117;
    --surface2:  #131920;
    --border:    #1e2d3d;
    --border2:   #243447;
    --text:      #e2e8f0;
    --muted:     #8899a6;

    --cal-day-font:    clamp(14px, 1.15vw, 24px);
    --cal-chip-name:   clamp(13px, 1.1vw,  22px);
    --cal-chip-time:   clamp(10px, 0.85vw, 17px);
    --cal-chip-pad-v:  clamp(6px,  0.55vw, 12px);
    --cal-chip-pad-h:  clamp(8px,  0.7vw,  14px);
    --cal-chip-border: clamp(3px,  0.35vw, 7px);
    --cal-legend-font: clamp(12px, 1vw,    20px);
  }

html, body { height:100%; overflow:hidden; }

body {
    display:flex;
    flex-direction:column;
    position: relative;
    background:
      radial-gradient(1100px 520px at 75% -10%, rgba(29,111,164,.10) 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(124,58,237,.06) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
}

  /* ── AMBIENT BACKGROUND (subtle panning grid + periodic flash) ── */
  #ambientBg {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  #ambientGrid {
    position: absolute;
    inset: -60px;
    background-image:
      linear-gradient(rgba(120,170,230,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,170,230,0.06) 1px, transparent 1px);
    background-size: 44px 44px;
    animation: ambientPan 40s linear infinite;
  }
  @keyframes ambientPan {
    from { transform: translate(0,0); }
    to   { transform: translate(44px,44px); }
  }
  #ambientFlash {
    position: absolute;
    inset: 0;
    background: #cfe0f5;
    opacity: 0;
    transition: opacity 120ms ease-out;
  }

  /* ── CALENDAR (the only view this page ever shows) ── */
  #calendarContainer {
    display: flex;
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
    flex-direction: column;
    background: transparent;
  }

  #calendarScrollWrapper {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 8px 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* One of the two stacked weeks. Each takes exactly half the available
     vertical space, so 14 days always fit with zero scrolling. */
  .cal-week-grid {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(96,165,250,.28);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(29,111,164,.10);
  }
  /* This week is what someone actually needs to act on — a touch
     brighter border/glow. Next week recedes slightly rather than
     competing for the same visual weight. */
  .cal-week-grid.current-week {
    border-color: rgba(96,165,250,.55);
    box-shadow: 0 0 34px rgba(29,111,164,.22);
  }
  .cal-week-grid.next-week {
    border-color: rgba(96,165,250,.14);
    box-shadow: none;
    opacity: 0.88;
  }
  .cal-week-tag {
    position: absolute; top: 8px; right: 10px; z-index: 5;
    font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 5px;
    background: rgba(29,111,164,.35); color: #93c5fd;
    border: 1px solid rgba(96,165,250,.4);
    pointer-events: none;
  }

  .cal-grid-headrow {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: rgba(96,165,250,.22);
    border-bottom: 1px solid rgba(96,165,250,.28);
  }

  .cal-grid-bodyrow {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: rgba(96,165,250,.14);
  }

  .cal-day-header {
    display: block;
    padding: var(--cal-chip-pad-v) var(--cal-chip-pad-h);
    text-align: center;
    background: linear-gradient(160deg, rgba(20,28,44,.92) 0%, rgba(8,11,18,.98) 100%);
  }
  .cal-day-header .day-name {
    font-size: var(--cal-day-font);
    font-weight: 800;
    color: white;
    letter-spacing: 0.02em;
  }
  .cal-day-header.is-today {
    background: linear-gradient(135deg, rgba(29,111,164,.32), rgba(10,14,24,.95));
    box-shadow: inset 0 0 0 2px #3b82f6, 0 0 18px rgba(59,130,246,.45);
  }
  .cal-day-header.is-today .day-name { color: #93c5fd; text-shadow: 0 0 12px rgba(147,197,253,.6); }
  .cal-day-header.is-today::after {
    content: 'TODAY';
    display: block;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #60a5fa;
    margin-top: 2px;
  }

  /* Grid cell — content never overflows because JS sets --calScale on
     this element per-cell, shrinking font/padding only as much as that
     specific day's event count requires. */
  .cal-grid-cell {
    background: linear-gradient(160deg, rgba(16,22,34,.92) 0%, rgba(8,11,18,.98) 100%);
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .cal-events {
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    padding: calc(8px * var(--calScale, 1));
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: calc(6px * var(--calScale, 1));
  }

  .cal-empty-day {
    padding: calc(var(--cal-chip-pad-v) * var(--calScale, 1)) calc(var(--cal-chip-pad-h) * var(--calScale, 1));
    border-left: calc(var(--cal-chip-border) * var(--calScale, 1)) solid #16a34a;
    border-radius: 6px;
    line-height: 1.2;
    background: linear-gradient(135deg, rgba(22,163,74,.20), rgba(8,11,18,.9));
    box-shadow: 0 0 10px rgba(34,197,94,.18);
    color: #86efac;
    font-size: calc(var(--cal-chip-name) * var(--calScale, 1));
    font-weight: 800;
    text-align: left;
    white-space: normal;
  }

  .cal-event-chip {
    padding: calc(var(--cal-chip-pad-v) * var(--calScale, 1)) calc(var(--cal-chip-pad-h) * var(--calScale, 1));
    border-left-width: calc(var(--cal-chip-border) * var(--calScale, 1));
    border-left-style: solid;
    border-radius: 6px;
    line-height: 1.2;
    flex-shrink: 0;
    transition: filter 0.15s, transform 0.15s;
  }
  .cal-event-chip:hover { filter: brightness(1.2); transform: translateX(2px); }
  .cal-event-chip .chip-name {
    font-size: calc(var(--cal-chip-name) * var(--calScale, 1));
    font-weight: 800;
    white-space: normal;
    overflow-wrap: break-word;
    line-height: 1.25;
  }
  .cal-event-chip .chip-time {
    font-size: calc(var(--cal-chip-time) * var(--calScale, 1));
    font-weight: 700;
    opacity: 0.9;
    margin-top: calc(2px * var(--calScale, 1));
  }
  .cal-chip-radar   { background: linear-gradient(135deg, rgba(220,38,38,.30), rgba(10,14,24,.88)); border-left-color: #ef4444; color: #fca5a5; box-shadow: 0 0 12px rgba(239,68,68,.28); }
  .cal-chip-onsite  { background: linear-gradient(135deg, rgba(124,58,237,.30), rgba(10,14,24,.88)); border-left-color: #a855f7; color: #d8b4fe; box-shadow: 0 0 12px rgba(168,85,247,.28); }
  .cal-chip-headsup { background: linear-gradient(135deg, rgba(37,99,235,.30), rgba(10,14,24,.88)); border-left-color: #3b82f6; color: #93c5fd; box-shadow: 0 0 12px rgba(59,130,246,.28); }
  .cal-chip-call    { background: linear-gradient(135deg, rgba(245,158,11,.26), rgba(10,14,24,.88)); border-left-color: #f59e0b; color: #fcd34d; box-shadow: 0 0 12px rgba(245,158,11,.24); }
  .cal-chip-weeklybrief { outline: 2px solid #ffffff; outline-offset: -2px; box-shadow: 0 0 16px rgba(255,255,255,.35); }
  /* Only applied within today's column — everything happening right now
     gets a quiet glow layered on top of its normal type color; anything
     already over today dims slightly. No animation, matching the
     dashboard's "no blinking, just enough" table-row treatment. */
  .cal-event-chip.cal-chip-active { box-shadow: 0 0 14px 1px currentColor; }
  .cal-event-chip.cal-chip-elapsed { opacity: 0.55; }
  .weekly-brief-pulse { animation: weeklyBriefPulse 3.2s ease-in-out infinite; }
  @keyframes weeklyBriefPulse {
    0%, 100% { box-shadow: 0 0 18px rgba(49,87,213,.3); }
    50%      { box-shadow: 0 0 30px rgba(49,87,213,.6); }
  }

  .cal-legend-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: clamp(14px, 1.4vw, 30px);
    flex-wrap: wrap;
    padding: clamp(8px, 0.7vw, 18px) clamp(12px, 1.2vw, 24px);
    font-size: var(--cal-legend-font);
    font-weight: 800;
    background: linear-gradient(160deg, rgba(20,28,44,.85) 0%, rgba(8,11,18,.95) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(96,165,250,.22);
  }
  .cal-legend-item { display: flex; align-items: center; gap: 10px; }
  .cal-legend-swatch { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }

  /* ── MODAL (calendar day-chip detail popups) ── */
  #calendarModal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 9999;
  }
  .modal-box {
    background: linear-gradient(160deg, rgba(20,28,44,.95) 0%, rgba(8,11,18,.98) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(96,165,250,.3);
    box-shadow: 0 0 40px rgba(29,111,164,.18);
    border-radius: 12px; width: 480px; max-width: 90%; padding: 24px;
    color: var(--text); margin: 80px auto;
  }
  .modal-box h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .modal-row { margin-bottom: 10px; font-size: 13px; }
  .modal-row strong { display: block; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .modal-close { margin-top: 16px; padding: 8px 20px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600; }

  /* ── FOOTER ── */
  .footer { background: var(--surface); border-top: 1px solid var(--border); padding: 6px 20px; display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 11px; color: var(--muted); }
  .footer-dot { color: #1d6fa4; }

  /* ── MISC ── */
  .empty-state { padding: 12px; text-align: center; color: var(--muted); font-size: 12px; }
  ::-webkit-scrollbar       { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #243447; border-radius: 3px; }
</style>
</head>
<body>

<div id="ambientBg">
  <div id="ambientGrid"></div>
  <div id="ambientFlash"></div>
</div>

<div id="weeklyReminderBanner" class="weekly-brief-pulse" style="
display:none;
background:linear-gradient(135deg, rgba(49,87,213,.55), rgba(10,14,24,.9));
border-top:1px solid rgba(96,165,250,.4);
border-bottom:1px solid rgba(96,165,250,.4);
padding:10px 18px;
color:white;
font-weight:700;
font-size:15px;
text-align:center;
letter-spacing:.02em;
">
📋 Weekly Brief Due Today — Don't forget to prepare and distribute this week's DSS Weekly Brief.
</div>

<!-- ── CALENDAR (only view) ── -->
<div id="calendarContainer">
  <div id="calendarLegendBar" class="cal-legend-bar"></div>
  <div id="calendarScrollWrapper">
    <!-- Calendar table injected here by buildCalendar() -->
  </div>
</div>

<!-- CALENDAR DETAIL MODAL -->
<div id="calendarModal">
  <div class="modal-box">
    <div id="calendarModalContent"></div>
    <button class="modal-close" id="btnCloseModal">Close</button>
  </div>
</div>

<!-- ── FOOTER ── -->
<div class="footer">
  <span class="footer-dot">●</span>
  <span>NWS Burlington</span>
  <span class="footer-dot">●</span>
  <span>Supporting Decision Support Services Across Vermont and Northern NY</span>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  STATE
//  This build shows ONLY the calendar. Today / Tomorrow / 7-day /
//  30-day / Analytics / external dashboards, the environmental-risk
//  links, and the Leaflet map have all been removed — none of them
//  fed the calendar, they were just extra weight being loaded every
//  refresh. What's left: fetch events.json + calls.json, keep them
//  fresh on a timer, and render the 2-week calendar grid.
// ══════════════════════════════════════════════════════════════
var dssRows  = [];
var callRows = [];

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Safe wrapper for building an href — escapes the value and rejects
// anything that isn't http(s), since these strings ultimately come
// from user-typed "Slides Link" / "Contact Info" fields.
function safeHref(url) {
  var u = String(url || '').trim();
  if (!/^https?:\/\//i.test(u)) return '';
  return escapeHtml(u);
}

function formatTimeRange(start, end) {
  if (!start) return '';
  return end ? (start + ' – ' + end) : start;
}

// Accepts "H:MM AM/PM" (the format times are stored/displayed in) as well
// as raw "HH:MM" 24-hour values, and returns minutes-since-midnight so
// DSS events and coordination calls can be sorted chronologically within
// a day instead of falling back to whatever order they arrived in.
// Unparseable/blank times sort to the end of the day (9999).
function parseTimeToMinutes(timeStr) {
  if (!timeStr) return 9999;
  var s = String(timeStr).trim();

  var ampm = s.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (ampm) {
    var h = parseInt(ampm[1], 10);
    var min = parseInt(ampm[2], 10);
    if (ampm[3].toUpperCase() === 'PM' && h < 12) h += 12;
    if (ampm[3].toUpperCase() === 'AM' && h === 12) h = 0;
    return h * 60 + min;
  }

  var military = s.match(/^(\d{1,2}):(\d{2})$/);
  if (military) {
    return parseInt(military[1], 10) * 60 + parseInt(military[2], 10);
  }

  return 9999;
}

// Picks whichever time field is relevant to a DSS row's type so it can be
// merged and sorted alongside coordination calls (Heads-up -> Email Due By,
// Radar Watch -> Radar Start, On-Site -> DSS Start).
function getCalDssSortMinutes(ev) {
  var timeStr = '';
  if (ev.type === 'Heads-up email') timeStr = ev.emailTime;
  else if (ev.type === 'Active radar watch') timeStr = ev.radarStart;
  else if (ev.type === 'On-Site DSS') timeStr = ev.dssStart;
  return parseTimeToMinutes(timeStr);
}

// ══════════════════════════════════════════════════════════════
//  DETAIL MODAL (click a calendar chip to see full info)
// ══════════════════════════════════════════════════════════════
function closeCalendarModal() { document.getElementById('calendarModal').style.display = 'none'; }
function showCalendarModal(html) {
  document.getElementById('calendarModalContent').innerHTML = html;
  document.getElementById('calendarModal').style.display   = 'block';
}

function showDssDetails(eventName) {
  var headers        = dssRows[0];
  var eventCol       = headers.indexOf('Event Name');
  var typeCol        = headers.indexOf('DSS Type');
  var contactCol     = headers.indexOf('Contact Name');
  var contactInfoCol = headers.indexOf('Contact Info');
  var radarStartCol  = headers.indexOf('Radar Start');
  var radarEndCol    = headers.indexOf('Radar End');
  var emailCol       = headers.indexOf('Email Due By');
  var dssStartCol    = headers.indexOf('DSS Start');
  var dssEndCol      = headers.indexOf('DSS End');
  var html = '';
  for (var i = 1; i < dssRows.length; i++) {
    var row = dssRows[i];
    if (row[eventCol] !== eventName) continue;

    var radarRange = row[radarStartCol]
      ? row[radarStartCol] + (row[radarEndCol] ? ' – ' + row[radarEndCol] : '')
      : '';
    var dssRange = (dssStartCol !== -1 && row[dssStartCol])
      ? row[dssStartCol] + (dssEndCol !== -1 && row[dssEndCol] ? ' – ' + row[dssEndCol] : '')
      : '';

    html =
      '<h2>' + escapeHtml(row[eventCol]) + '</h2>' +
      '<div class="modal-row"><strong>DSS Type</strong>'     + escapeHtml(row[typeCol])        + '</div>' +
      '<div class="modal-row"><strong>Contact</strong>'      + escapeHtml(row[contactCol])     + '</div>' +
      '<div class="modal-row"><strong>Contact Info</strong>' + escapeHtml(row[contactInfoCol]) + '</div>' +
      (row[emailCol] ? '<div class="modal-row"><strong>Email Due</strong>'   + escapeHtml(row[emailCol]) + '</div>' : '') +
      (radarRange ? '<div class="modal-row"><strong>Radar Watch</strong>' + escapeHtml(radarRange) + '</div>' : '') +
      (dssRange ? '<div class="modal-row"><strong>On-Site DSS Time</strong>' + escapeHtml(dssRange) + '</div>' : '');
    break;
  }
  showCalendarModal(html);
}

function showCallDetails(rowIndex) {
  var call = callRows[rowIndex];
  if (!call) return;
  var urlMatch = String(call[3] || '').match(/https?:\/\/\S+/);
  var joinHref = urlMatch ? safeHref(urlMatch[0]) : '';
  var html =
    '<h2>' + escapeHtml(call[2]) + '</h2>' +
    '<div class="modal-row"><strong>Date</strong>'         + escapeHtml(call[0]) + '</div>' +
    '<div class="modal-row"><strong>Time</strong>'         + escapeHtml(call[1]) + '</div>' +
    '<div class="modal-row"><strong>Contact Info</strong>' + escapeHtml(call[3]) + '</div>' +
    (call[4] ? '<div class="modal-row"><strong>Additional</strong>' + escapeHtml(call[4]) + '</div>' : '') +
    (joinHref ? '<br><a href="' + joinHref + '" target="_blank" style="display:inline-block;background:#1d6fa4;color:white;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:700;font-size:13px;">Join Meeting</a>' : '');
  showCalendarModal(html);
}

// ══════════════════════════════════════════════════════════════
//  WEEKLY BRIEF REMINDER BANNER
// ══════════════════════════════════════════════════════════════
function checkWeeklyReminder() {
  var today = new Date();
  if (today.getDay() !== 1) return; // Monday only
  document.getElementById("weeklyReminderBanner").style.display = "block";
}

function updateLastUpdated() {
  var el = document.getElementById('calLastUpdated');
  if (!el) return;
  var now = new Date();
  el.textContent = 'Updated ' + now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

// ══════════════════════════════════════════════════════════════
//  CALENDAR VIEW
// ══════════════════════════════════════════════════════════════
function buildCalendar() {
  var headers       = dssRows[0];
  if (!headers) return; // nothing loaded yet

  var eventCol      = headers.indexOf('Event Name');
  var eventDateCol  = headers.indexOf('Event Date');
  var typeCol       = headers.indexOf('DSS Type');
  var radarStartCol = headers.indexOf('Radar Start');
  var radarEndCol   = headers.indexOf('Radar End');
  var emailTimeCol  = headers.indexOf('Email Due By');
  var dssStartCol   = headers.indexOf('DSS Start');
  var dssEndCol     = headers.indexOf('DSS End');
  var cancelledCol  = headers.indexOf('Cancelled');

  var now = new Date();
  var todayIso = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  var startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  var dayBuckets  = Array(14).fill(null).map(function() { return []; });
  var callBuckets = Array(14).fill(null).map(function() { return []; });

  for (var ci = 1; ci < callRows.length; ci++) {
    var call = callRows[ci];
    if (String(call[5]).trim().toUpperCase() === 'TRUE') continue;
    var cp = String(call[0] || '').split('/');
    if (cp.length !== 3) continue;
    var callDate = new Date(cp[2], cp[0]-1, cp[1]);
    var diff = Math.floor((callDate - startOfWeek) / 86400000);
    if (diff >= 0 && diff < 14) callBuckets[diff].push({ event: call[2], time: call[1], rowIndex: ci });
  }

  for (var i = 1; i < dssRows.length; i++) {
    var row = dssRows[i];
    if (String(row[cancelledCol]).trim().toUpperCase() === 'TRUE') continue;
    var p = String(row[eventDateCol] || '').split('/');
    if (p.length !== 3) continue;
    var eDate = new Date(Number(p[2]), Number(p[0])-1, Number(p[1]));
    var diff2 = Math.floor((eDate - startOfWeek) / 86400000);
    if (diff2 >= 0 && diff2 < 14) {
      dayBuckets[diff2].push({
        name: row[eventCol], type: row[typeCol],
        radarStart: row[radarStartCol], radarEnd: row[radarEndCol],
        emailTime: row[emailTimeCol],
        dssStart: row[dssStartCol], dssEnd: row[dssEndCol]
      });
    }
  }

  // Live status for today's column only — everything else on the calendar
  // is a future or past day where "right now" doesn't mean anything.
  // Returns 'cal-chip-active' if genuinely in progress right now, or
  // 'cal-chip-elapsed' if its window (or deadline) has already passed.
  function getCalChipStatus(isToday, startMin, endMin) {
    if (!isToday || startMin === 9999) return '';
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    if (endMin !== null && endMin !== 9999) {
      if (nowMin >= startMin && nowMin <= endMin) return 'cal-chip-active';
      if (nowMin > endMin) return 'cal-chip-elapsed';
      return '';
    }
    // Point-in-time (heads-up deadline, coordination call) — no duration,
    // so just dim it once its time has passed.
    return nowMin > startMin ? 'cal-chip-elapsed' : '';
  }

  function dssChipHtml(ev, isToday) {
    var cls = 'cal-chip-headsup';
    var timeStr = ev.emailTime || '';
    var startMin = null, endMin = null;
    if (ev.type === 'Active radar watch') {
      cls = 'cal-chip-radar';
      timeStr = formatTimeRange(ev.radarStart, ev.radarEnd);
      startMin = parseTimeToMinutes(ev.radarStart);
      endMin   = ev.radarEnd ? parseTimeToMinutes(ev.radarEnd) : null;
    } else if (ev.type === 'On-Site DSS') {
      cls = 'cal-chip-onsite';
      timeStr = formatTimeRange(ev.dssStart, ev.dssEnd);
      startMin = parseTimeToMinutes(ev.dssStart);
      endMin   = ev.dssEnd ? parseTimeToMinutes(ev.dssEnd) : null;
    } else {
      startMin = parseTimeToMinutes(ev.emailTime);
    }

    var statusCls = getCalChipStatus(isToday, startMin, endMin);
    if (statusCls) cls += ' ' + statusCls;

    // BTV Weekly Brief is an internal office reminder riding along in the
    // heads-up-email bucket — give it a white outline so it doesn't blend
    // in with actual external DSS heads-up emails.
    if (/weekly brief/i.test(ev.name || '')) {
      cls += ' cal-chip-weeklybrief';
    }

    return (
      '<div class="cal-event-chip ' + cls + '" data-dss-event="' + escapeHtml(ev.name) + '">' +
        '<div class="chip-name">' + escapeHtml(ev.name) + '</div>' +
        (timeStr ? '<div class="chip-time">' + escapeHtml(timeStr) + '</div>' : '') +
      '</div>'
    );
  }

  function callChipHtml(callItem, isToday) {
    var statusCls = getCalChipStatus(isToday, parseTimeToMinutes(callItem.time), null);
    var cls = 'cal-chip-call' + (statusCls ? ' ' + statusCls : '');
    return (
      '<div class="cal-event-chip ' + cls + '" data-call-index="' + callItem.rowIndex + '">' +
        '<div class="chip-name">' + escapeHtml(callItem.event) + '</div>' +
        '<div class="chip-time">' + escapeHtml(callItem.time) + '</div>' +
      '</div>'
    );
  }

  
  function renderWeek(startDay) {
    var headerCells = '';
    var bodyCells   = '';

    for (var d = startDay; d < startDay + 7; d++) {
      var dd = new Date(startOfWeek);
      dd.setDate(startOfWeek.getDate() + d);
      var iso = dd.getFullYear() + '-' + String(dd.getMonth()+1).padStart(2,'0') + '-' + String(dd.getDate()).padStart(2,'0');
      var dayName  = dd.toLocaleDateString('en-US', { weekday: 'short' });
      var monthDay = (dd.getMonth()+1) + '/' + dd.getDate();
      var isToday  = iso === todayIso;

      headerCells +=
        '<span class="cal-day-header' + (isToday ? ' is-today' : '') + '">' +
          '<span class="day-name">' + dayName + ' ' + monthDay + '</span>' +
        '</span>';

      // Merge DSS events and coordination calls into one list per day and
      // sort by actual time-of-day, so a 9am call, an 11am radar watch,
      // and a 2pm on-site DSS render top-to-bottom in that order instead
      // of "all DSS first, then all calls" / raw sheet order. Weekly Brief
      // is still pinned to the very top of its day as a standing reminder,
      // ahead of anything else regardless of time.
      var mergedDayItems = dayBuckets[d].map(function(ev) {
        return {
          isBrief: /weekly brief/i.test(ev.name || ''),
          min: getCalDssSortMinutes(ev),
          html: dssChipHtml(ev, isToday)
        };
      }).concat(callBuckets[d].map(function(c) {
        return { isBrief: false, min: parseTimeToMinutes(c.time), html: callChipHtml(c, isToday) };
      }));

      mergedDayItems.sort(function(a, b) {
        if (a.isBrief && !b.isBrief) return -1;
        if (b.isBrief && !a.isBrief) return 1;
        return a.min - b.min;
      });

      var items = mergedDayItems.map(function(it) { return it.html; });
      var cellContent = items.length > 0
        ? items.join('')
        : '<div class="cal-empty-day">No Scheduled DSS or Coordination Calls</div>';
      bodyCells += '<div class="cal-grid-cell"><div class="cal-events">' + cellContent + '</div></div>';
    }

    var weekClass = startDay === 0 ? 'current-week' : 'next-week';
    var weekTag   = startDay === 0 ? '<div class="cal-week-tag">This Week</div>' : '<div class="cal-week-tag" style="background:rgba(96,165,250,.12);color:#93c5fd99;">Next Week</div>';

    return (
      '<div class="cal-week-grid ' + weekClass + '">' +
        weekTag +
        '<div class="cal-grid-headrow">' + headerCells + '</div>' +
        '<div class="cal-grid-bodyrow">' + bodyCells + '</div>' +
      '</div>'
    );
  }

  var legendBar = document.getElementById('calendarLegendBar');
  if (legendBar) {
    legendBar.innerHTML =
      '<div class="cal-legend-item"><span class="cal-legend-swatch" style="background:#ef4444;"></span>Radar Watch</div>' +
      '<div class="cal-legend-item"><span class="cal-legend-swatch" style="background:#3b82f6;"></span>Heads-Up Email</div>' +
      '<div class="cal-legend-item"><span class="cal-legend-swatch" style="background:#a855f7;"></span>On-Site DSS</div>' +
      '<div class="cal-legend-item"><span class="cal-legend-swatch" style="background:#f59e0b;"></span>Coordination Call</div>' +
      '<span id="calLastUpdated" style="margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;">Updated --:--:--</span>';
  }

  var wrapper = document.getElementById('calendarScrollWrapper');
  wrapper.innerHTML = renderWeek(0) + renderWeek(7);
  fitCalendarCells();
}

// ── TV / KIOSK PER-DAY AUTO-FIT ─────────────────────────────────
// Each day cell has a fixed height (set by the CSS grid). Most days
// have 1-2 events and render at full size. A day with a pile of
// events gets its OWN --calScale shrunk — via a real overflow check,
// not a guess based on count — until its content fits without
// scrolling. Other days on the same row are unaffected.
function fitCalendarCells() {
  var cells = document.querySelectorAll('#calendarScrollWrapper .cal-grid-cell');

  cells.forEach(function (cell) {
    var eventsEl = cell.querySelector('.cal-events');
    if (!eventsEl) return;

    var scale = 1;
    cell.style.setProperty('--calScale', scale);

    var attempts = 0;
    while (eventsEl.scrollHeight > eventsEl.clientHeight + 1 && scale > 0.4 && attempts < 40) {
      scale = Math.max(0.4, scale - 0.03);
      cell.style.setProperty('--calScale', scale.toFixed(2));
      attempts++;
    }
  });
}

// ══════════════════════════════════════════════════════════════
//  REFRESH — fetch events.json + calls.json, rebuild the calendar
// ══════════════════════════════════════════════════════════════
async function refreshDashboard() {
  try {
    const [eventsResponse, callsResponse] = await Promise.all([
      fetch("events.json?_=" + Date.now()),
      fetch("calls.json?_=" + Date.now())
    ]);
    if (!eventsResponse.ok) throw new Error("Unable to load events.json");
    if (!callsResponse.ok) throw new Error("Unable to load calls.json");
    dssRows  = await eventsResponse.json();
    callRows = await callsResponse.json();
  } catch (err) {
    console.error("refreshDashboard failed:", err);
  }

  checkWeeklyReminder();
  buildCalendar();
  updateLastUpdated();
}

// ══════════════════════════════════════════════════════════════
//  AMBIENT BACKGROUND FLASH
//  Fires a soft double-flicker every 9-14 seconds. Purely decorative —
//  not tied to any real data on this page.
// ══════════════════════════════════════════════════════════════
function startAmbientFlash() {
  var flash = document.getElementById('ambientFlash');
  if (!flash) return;
  function doFlash() {
    flash.style.opacity = '0.09';
    setTimeout(function() { flash.style.opacity = '0'; }, 120);
    setTimeout(function() { flash.style.opacity = '0.05'; }, 260);
    setTimeout(function() { flash.style.opacity = '0'; }, 340);
    var next = 9000 + Math.random() * 5000;
    setTimeout(doFlash, next);
  }
  setTimeout(doFlash, 1500);
}

// ══════════════════════════════════════════════════════════════
//  DOM READY
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {

  startAmbientFlash();

  document.getElementById('btnCloseModal').addEventListener('click', closeCalendarModal);
  document.getElementById('calendarModal').addEventListener('click', function(e) {
    if (e.target === this) closeCalendarModal();
  });

  document.getElementById('calendarScrollWrapper').addEventListener('click', function(e) {
    var chip = e.target.closest('[data-dss-event]');
    if (chip) { showDssDetails(chip.getAttribute('data-dss-event')); return; }
    var callChip = e.target.closest('[data-call-index]');
    if (callChip) { showCallDetails(parseInt(callChip.getAttribute('data-call-index'), 10)); }
  });

  refreshDashboard();

  var _calResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(_calResizeTimer);
    _calResizeTimer = setTimeout(fitCalendarCells, 150);
  });

  // Since this page stays open (unlike a page that gets externally
  // reloaded every 30s), keep the data current on a timer.
  setInterval(refreshDashboard, 300000);
});
</script>
