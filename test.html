<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; }
  #map { width:100%; height:100%; }
  #log { position:fixed; top:0; left:0; z-index:9999; background:#000; color:#0f0; font:14px monospace; padding:6px; }
</style>
</head>
<body>
<div id="log">loading…</div>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var log = document.getElementById('log');
  var map = L.map('map').setView([44.4, -73.2], 8);
  L.tileLayer('https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', { maxZoom: 19 })
    .on('tileload', function(){ log.textContent = 'TILE LOADED OK'; })
    .on('tileerror', function(){ log.textContent = 'TILE ERROR'; })
    .addTo(map);
</script>
</body>
</html>
