<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #06090f;
    --surface:   #0d1117;
    --surface2:  #131920;
    --border:    #1e2d3d;
    --border2:   #243447;
    --text:      #e2e8f0;
    --muted:     #8899a6;
    --accent:    #1d6fa4;
    --green:     #16a34a;
    --green-bg:  #052e16;
    --red:       #dc2626;
    --red-bg:    #3b0a0a;
    --amber:     #d97706;
    --amber-bg:  #451a03;
    --blue:      #2563eb;
    --blue-bg:   #172554;
    --purple:    #7c3aed;
    --purple-bg: #2e1065;
  }

html,
body{
    height:100%;
    overflow:hidden;
}

body{
    display:flex;
    flex-direction:column;

    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
}

  /* ── TOP HEADER ── */
  .top-header {
    background: #0f1b2de0;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header-brand .nws-logo { width: 160px; height: auto; display: block; object-fit: contain; }
  .header-brand h1 { font-size: 17px; font-weight: 600; color: #fff; line-height: 1.1; white-space: nowrap; }
  .header-sep { width: 1px; background: var(--border); align-self: stretch; margin: 0 4px; flex-shrink: 0; }

  /* ── HEADER QUICK ACTIONS (persistent toolbar) ── */
  .header-actions {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .hdr-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 11px; border-radius: 6px; font-size: 11px; font-weight: 700;
    border: 1px solid var(--border2); background: var(--surface2); color: var(--muted);
    cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
  }
  .hdr-btn:hover { background: #1a2535; border-color: #2d4a6a; color: var(--text); }
  .hdr-btn.green { border-color: #0a3520; color: #4ade80; }
  .hdr-btn.green:hover { background: #052e16; }
  .hdr-btn.blue  { border-color: #1a3060; color: #60a5fa; }
  .hdr-btn.blue:hover  { background: #172554; }
  .hdr-btn .hdr-icon { font-size: 13px; }

  .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .refresh-btn {
    background: #112233; border: 1px solid #1d6fa4; color: #64b5f6;
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    font-size: 15px; display: flex; align-items: center; justify-content: flex-start;
    transition: background 0.15s;
  }
  .refresh-btn:hover { background: #1a3a55; }

  /* ── STATUS BAR (4 narrower cards) ── */
  .status-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    border-bottom: 1px solid var(--border);
  }
  .status-card {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--surface);
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  .status-card:last-child { border-right: none; }
  .status-icon {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .status-icon.green  { background: #052e16; border: 2px solid #16a34a; }
  .status-icon.amber  { background: #451a03; border: 2px solid #d97706; }
  .status-icon.red    { background: #3b0a0a; border: 2px solid #dc2626; }
  .status-icon.blue   { background: #172554; border: 2px solid #2563eb; }
  .status-icon.purple { background: #2e1065; border: 2px solid #7c3aed; }
  .status-icon.teal   { background: #042f2e; border: 2px solid #0d9488; }
  .status-label { font-size: 11px; font-weight: 700; letter-spacing:1px; color: var(--muted); text-transform: uppercase; margin-bottom: 1px; }
  .status-value { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .status-sub   { font-size: 12px; line-height: 1.3; color: var(--muted); }

  /* ── NAV TOOLBAR ── */
.nav-toolbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 5px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  overflow-x: auto;
}
.nav-group {
  display: flex; align-items: center; gap: 3px;
  padding: 3px 6px; flex:0 0 auto;
  flex: 0 0 auto;
}
.nav-group-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; white-space: nowrap;
  margin-right: 5px; flex-shrink: 0;
  opacity: 1;
}
.nav-group.group-date .nav-group-label { color: #60a5fa; }
.nav-group.group-risk .nav-group-label { color: #fbbf24; }
.nav-group.group-dash .nav-group-label { color: #a78bfa; }
.nav-btn {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border: 1px solid var(--border2);
  border-radius: 6px; background: var(--surface2); color: var(--muted);
  font-size: 11px; font-weight: 600; cursor: pointer;
  transition: all 0.15s; white-space: nowrap; font-family: inherit;
}
.nav-btn:hover  { background: #1a2535; color: var(--text); border-color: #2d4a6a; }
.nav-btn.active { background: #112233; color: #64b5f6; border-color: #1d6fa4; }
.nav-btn .icon  { font-size: 13px; }
.nav-sep { width: 1px; background: var(--border); margin: 0 4px; align-self: stretch; }
.nav-view-label { display: none; }
.nav-view-label span { color: #64b5f6; font-weight: 700; }

  /* ── MAIN LAYOUT ── */
  .main-layout {
    flex: 1;
    display: grid;
    grid-template-columns:
        260px
        minmax(600px,1fr)
        minmax(480px,32vw);
    min-height: 0;
}

  /* ── LEFT PANEL ── */
  .left-panel {
    background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .panel-section { padding: 12px 12px 8px; border-bottom: 1px solid var(--border); }
  .panel-section-title {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .panel-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .summary-tile {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px; display: flex; align-items: center; gap: 7px;
  }
  .tile-icon  { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
  .tile-num   { font-size: 20px; font-weight: 900; line-height: 1; }
  .tile-label { font-size: 9px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.2; }
  .tile-red    { border-left: 3px solid var(--red); }
  .tile-blue   { border-left: 3px solid var(--blue); }
  .tile-purple { border-left: 3px solid var(--purple); }
  .upcoming-list {
  display: flex; flex-direction: column; gap: 3px;
  max-height: 230px; overflow-y: auto;
}
  .upcoming-item {
  border-radius: 7px; padding: 8px 10px; margin-bottom: 5px;
  transition: transform 0.2s; cursor: pointer;
  background: rgba(217, 119, 6, 0.08);
  border-left: 4px solid #d97706;
}
  .upcoming-item:hover         { transform: translateX(3px); }
  .upcoming-item-name          { font-size: 11px; font-weight: 700; line-height: 1.2; }
  .upcoming-item-meta          { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .upcoming-radar   { background: rgba(239,68,68,.12);  border-left: 4px solid #ef4444; }
  .upcoming-headsup { background: rgba(59,130,246,.12); border-left: 4px solid #3b82f6; }
  .upcoming-onsite  { background: rgba(124,58,237,.12); border-left: 4px solid #7c3aed; }

  /* ── CENTER PANEL ── */
  .center-panel { background: var(--bg); overflow-y: auto; display: flex; flex-direction: column; }
  .data-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .data-section-header { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
  .data-section-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .data-section-header .section-icon { font-size: 14px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th {
    background: #1b2d3c; color: #ffffff; font-size: 10px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
    padding: 6px 10px; text-align: left;
    border-bottom: 2px solid #3b82f6;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
    white-space: nowrap;
  }
  .data-table td {
    padding: 7px 10px; border-bottom: 1px solid var(--border);
    vertical-align: middle; background: var(--surface);
  }
  .data-table tr:hover td { background: #0f1b2a; }

  /* ── COLORED LEFT BORDER ON TABLE ROWS BY DSS TYPE ── */
  .data-table tr.row-radar   td:first-child { border-left: 4px solid #dc2626; }
  .data-table tr.row-headsup td:first-child { border-left: 4px solid #2563eb; }
  .data-table tr.row-onsite  td:first-child { border-left: 4px solid #7c3aed; }

  .dss-type-badge {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 700; white-space: nowrap;
  }
  .badge-radar   { background: #3b0a0a; color: #f87171; border: 1px solid #7f1d1d; }
  .badge-email   { background: #172554; color: #93c5fd; border: 1px solid #1e3a8a; }
  .badge-onsite  { background: #2e1065; color: #c4b5fd; border: 1px solid #7c3aed; }
  .badge-default { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .join-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; background: #112233; border: 1px solid #1d6fa4;
    color: #64b5f6; border-radius: 5px; text-decoration: none;
    font-size: 11px; font-weight: 600; transition: background 0.15s;
  }
  .join-btn:hover { background: #1a3a55; }
  .table-scroll { overflow-x: auto; }
  .time-chip    { font-size: 11px; color: var(--muted); font-weight: 600; }
  .view-more-row      { background: #223344; }
  .view-more-row:hover { background: #30465c; }

  /* ── TODAY AT A GLANCE TIMELINE ── */
  .glance-section {
    padding: 10px 14px 12px;
    min-height: 165px; 
    border-bottom: 1px solid var(--border);
    background: #080d14;
  }
  .glance-title {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .glance-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
 .timeline-track {
  position: relative;
  height: 150px;
  overflow-x: auto;
  overflow-y: hidden;
}
.timeline-track::-webkit-scrollbar { height: 8px; }
.timeline-track::-webkit-scrollbar-thumb {
  background: #4b6b8c; border-radius: 6px; border: 1px solid #101720;
}
.timeline-track::-webkit-scrollbar-track { background: #101720; }

.timeline-inner {
  position: relative;
  height: 100%;
  min-width: 100%;
}

.timeline-spine {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 2px;
  background: #2d3f52;
}

.timeline-empty {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
  padding: 4px 0;
}

.tl-item {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateX(-50%);
}
.tl-item.past { opacity: 0.45; }
.tl-item.past .tl-dot { box-shadow: none; filter: grayscale(60%); }

.tl-above,
.tl-below {
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.tl-above { justify-content: flex-end; }   /* content hugs the dot from above */
.tl-below { justify-content: flex-start; } /* content hugs the dot from below */

.tl-dot-wrap { flex: 0 0 auto; }

.tl-dot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid; flex-shrink: 0;
  background: var(--bg);
}
.tl-dot.radar   { border-color: #dc2626; box-shadow: 0 0 6px rgba(220,38,38,.5); }
.tl-dot.headsup { border-color: #2563eb; box-shadow: 0 0 6px rgba(37,99,235,.5); }
.tl-dot.onsite  { border-color: #7c3aed; box-shadow: 0 0 6px rgba(124,58,237,.5); }
.tl-dot.call    { border-color: #d97706; box-shadow: 0 0 6px rgba(217,119,6,.5); }

.tl-label {
  font-size: 12px;
  line-height: 1.2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-align: center;
  width: 110px;
}

.tl-time {
  font-size: 11px;
  font-weight: 700;
  color: #d1d5db;
  width: 110px;
  text-align: center;
  white-space: nowrap;
}

.tl-icon {
  flex-shrink: 0;
}
.tl-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}

  /* ── RIGHT PANEL (map fills full height) ── */
  .right-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
    position: relative;
}
  .map-header {
    flex: 0 0 auto; display: flex;
    justify-content: space-between; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    background: var(--surface); z-index: 5;
  }
  .map-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 5px;
  }
 #map {
    flex: 1;
    width: 100%;
    min-height: 0;
}
  .map-legend {
    background: rgba(15,25,35,.88); color: white;
    border-radius: 8px; padding: 6px 8px; font-size: 11px; line-height: 1.3;
    box-shadow: 0 2px 8px rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08);
  }
  .legend-title { font-size: 10px; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .08em; color: #d8e6f5; }
  .legend-row   { display: flex; align-items: center; gap: 5px; margin: 2px 0; }
  .legend-dot   { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-dot.radar   { background: #ef4444; }
  .legend-dot.headsup { background: #2563eb; }
  .legend-dot.onsite  { background: #7c3aed; }

.last-updated-box{
    display:flex;
    flex-direction:column;
    justify-content:center;

    background:#0f1b2d;
    border:1px solid var(--border2);
    border-radius:6px;

    padding:5px 10px;
    min-width:120px;
}

.last-updated-label{
    font-size:9px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.08em;
}

#lastUpdatedText{
    font-size:13px;
    font-weight:700;
    color:#64b5f6;
}

#analyticsContainer{
    display:none;
    height:100%;
    background:#05080d;
    padding:20px;
    overflow:auto;
}
#analyticsHeatMap{
    flex:1;
    width:100%;
    min-height:0;
    border-radius:12px;
}
  /* Risk level button colors */
.risk-none    { color: #8899a6 !important; border-color: #1e2d3d !important; }
.risk-marginal{ color: #86efac !important; border-color: #166534 !important; background: #052e16 !important; }
.risk-slight  { color: #fde68a !important; border-color: #854d0e !important; background: #422006 !important; }
.risk-enhanced{ color: #fdba74 !important; border-color: #9a3412 !important; background: #431407 !important; }
.risk-moderate{ color: #f87171 !important; border-color: #991b1b !important; background: #3b0a0a !important; }
.risk-high    { color: #c084fc !important; border-color: #7e22ce !important; background: #2e1065 !important; }
.risk-heat-low      { color: #86efac !important; border-color: #166534 !important; background: #052e16 !important; }
.risk-heat-minor    { color: #fef08a !important; border-color: #854d0e !important; background: #422006 !important; }
.risk-heat-moderate { color: #fdba74 !important; border-color: #9a3412 !important; background: #431407 !important; }
.risk-heat-high     { color: #f87171 !important; border-color: #991b1b !important; background: #3b0a0a !important; }
.risk-heat-extreme  { color: #c084fc !important; border-color: #7e22ce !important; background: #2e1065 !important; }
.dss-filter-toggle {
  padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--tc-border, #374151);
  background: var(--surface2); color: var(--muted); font-family: inherit;
  transition: all 0.15s;
}
.dss-filter-toggle.sel {
  background: color-mix(in srgb, var(--tc-color) 15%, #111827);
  color: var(--tc-color); border-color: var(--tc-border);
}
.analytics-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.analytics-title{ font-size:34px; font-weight:800; color:white;}
.analytics-subtitle{ font-size:13px; color:#8fa6bd; margin-top:5px;}
.analytics-kpis{ display:grid; grid-template-columns:repeat(5,1fr); gap:15px; margin-bottom:20px;}
.kpi-card{ background:#111827; border:1px solid #1f2937; border-radius:12px; padding:14px; text-align:center; transition:.25s;}
.kpi-card:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.35);}
.kpi-value{ font-size:30px; font-weight:800; color:#4ea3ff;}
.pie-container{
    position: relative;
    height: 220px;
    width: 100%;
}
.analytics-grid{
    display:flex;
    gap:20px;
    align-items:stretch;
    height:900px;
}
.analytics-panel{
    background:#111827;
    border-radius:14px;
    border:1px solid #1f2937;
    padding:14px;
    display:flex;
    flex-direction:column;
}
.analytics-map-column{
    flex:1.6;
    display:flex;
}
.analytics-chart-column{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:20px;
}
.analytics-panel h3{ margin-top:0;  margin:0 0 8px; font-size:16px; color:white;}
.chart-container{
    flex:1;
    position:relative;
    min-height:0;
}
.heat-panel{
    flex:1;
    display:flex;
    flex-direction:column;
}
.threat-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 5px;
  margin: 6px 0;
}
 
.threat-card {
  background: #111827;
  border-left: 3px solid var(--tc-border, #374151);
  border-radius: 0 6px 6px 0;
  padding: 9px 11px;      /* was 6px 9px */
  display: flex;
  align-items: center;
  gap: 10px;              /* was 8px */
  transition: all .25s ease;
  cursor: pointer;
}
.threat-card:hover {
  transform: translateY(-2px);
  filter: brightness(1.12);
  box-shadow: 0 6px 14px rgba(0,0,0,.3);
}
.threat-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.threat-detail-tile {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px;
}
.threat-detail-tile .tdt-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 3px;
}
.threat-detail-tile .tdt-value { font-size: 16px; font-weight: 800; color: var(--text); }
.threat-detail-empty {
  margin-top: 14px; padding: 10px 12px; background: #0a1628;
  border: 1px solid var(--border2); border-radius: 8px;
  font-size: 12px; color: var(--muted); line-height: 1.5;
}
 
.threat-dial{
    width:36px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    border:2px solid var(--tc-border);

    font-size:13px;
    font-weight:800;
    line-height:1;

    flex-shrink:0;
}
 
.threat-meta{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
    flex:1;
}
 
.threat-type{
    font-size:9px;
    color:#9ca3af;
    font-weight:600;
}
 
.threat-label{
    font-size:11px;
    font-weight:800;
    color:var(--tc-color,#4b5563);
    margin-top:2px;
